<style>
  :root{
    --bg:#eef1fb; --card:#ffffff; --ink:#141a2e; --sub:#5b6577; --line:#e3e8f4;
    --pri:#4f5dff; --pri2:#e9ecff; --ok:#0fb37a; --ok2:#dff7ee; --warn:#ff8a1f; --warn2:#fff0db; --red:#ff4d61; --red2:#ffe1e6; --teal:#06b6d4;
    --grad:linear-gradient(135deg,#5b6bff 0%,#8a5cff 100%);
    --shadow:0 8px 24px rgba(40,52,120,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
  .wrap{max-width:760px;margin:0 auto;padding:14px 14px 96px}
  .topbar{display:flex;align-items:center;margin:-14px -14px 12px;position:sticky;top:0;z-index:30;background:var(--grad);padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;box-shadow:0 6px 18px rgba(79,93,255,.25)}

  .banner{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}

  .banner .b .v{font-size:18px;font-weight:800}
  .banner .b .k{font-size:11px;color:var(--sub)}
  .banner .b.red{border-color:var(--red);background:var(--red2)}.banner .b.red .v{color:var(--red)}
  .card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
  .sec{font-size:12px;font-weight:700;color:var(--sub);margin:4px 2px 10px;letter-spacing:1px}
  .sec2{font-size:13px;font-weight:700;color:var(--pri);margin:14px 2px 8px}
  select,input,textarea{font-family:inherit;font-size:16px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;color:var(--ink);width:100%}
  textarea{resize:vertical}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{appearance:none;border:none;border-radius:13px;padding:11px 16px;font-size:15px;font-weight:600;cursor:pointer;background:var(--pri);color:#fff;min-height:46px;box-shadow:0 4px 12px rgba(79,110,247,.22)}
  .btn.ghost{background:var(--pri2);color:var(--pri);box-shadow:none}
  .btn.sm{padding:7px 12px;font-size:13px;min-height:36px;border-radius:10px}
  .btn.danger{background:#fff;color:var(--red);border:1px solid var(--red)}
  .pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--pri2);color:var(--pri)}
  .pill.red{background:var(--red2);color:var(--red)}
  .pill.ok{background:var(--ok2);color:var(--ok)}
  .pill.warn{background:var(--warn2);color:var(--warn)}
  .muted{color:var(--sub);font-size:13px}
  .list{display:flex;flex-direction:column;gap:8px}
  .item{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:13px;background:#fff}
  .item .main{flex:1;min-width:0}
  .item .t{font-weight:600}
  .item .s{font-size:12px;color:var(--sub);margin-top:2px}
  .item .tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--pri2);color:var(--pri)}
  .item .tag.red{background:var(--red2);color:var(--red)}
  .item .tag.ok{background:var(--ok2);color:var(--ok)}
  .item .tag.warn{background:var(--warn2);color:var(--warn)}
  .keymat{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-size:13px;padding:8px 12px;border-radius:10px;background:#e9edfb;border:1px solid var(--line);cursor:pointer}
  .chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
  .catbox{margin-top:6px}
  .catbox .ct{font-size:12px;color:var(--sub);margin:8px 0 4px;display:flex;align-items:center;gap:8px}
  .catbox .ct input{flex:1;font-size:13px;padding:6px 8px}
  .fbout{white-space:pre-wrap;background:#f4f6fd;border:1px dashed var(--line);border-radius:12px;padding:12px;font-size:14px;line-height:1.7;min-height:120px;color:var(--sub)}
  .modal{position:fixed;top:0;left:0;right:0;bottom:auto;height:100vh;height:100dvh;background:rgba(20,26,46,.5);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .modal.on{display:flex}
  .sheet{background:#fff;width:100%;max-width:760px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;max-height:88dvh;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  /* ---- 手机端：弹窗底部按钮吸底 + 视口自适应（软键盘/浏览器工具栏不遮按钮） ---- */
  .sheet:has(>.row:last-child){padding-bottom:0}
  .sheet>.row:last-child{position:sticky;bottom:0;z-index:3;background:#fff;padding:10px 0 calc(10px + env(safe-area-inset-bottom));margin-top:12px;border-top:1px solid var(--line,#e5e7eb)}
  .btn,.sgb,.tab,.chip,.closeX{touch-action:manipulation}
  .sheet h3{margin:0 0 12px;font-size:17px}
  .field{margin-bottom:10px}
  .field label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px}
  .nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:40;overflow-x:auto;padding-bottom:env(safe-area-inset-bottom)}
  .nav .tab{flex:1 0 auto;text-align:center;padding:8px 4px;font-size:12px;color:var(--sub);cursor:pointer;min-width:52px}
  .nav .tab .ic{width:24px;height:24px;margin:0 auto 2px;display:block}
  .nav .tab.on{color:var(--pri);font-weight:800}
  .nav .tab.on::after{content:"";display:block;width:24px;height:3px;border-radius:3px;background:var(--pri);margin:3px auto 0}
  .hide{display:none}
  .empty{text-align:center;color:var(--sub);padding:20px;font-size:14px}
  .closeX{float:right;font-size:22px;color:var(--sub);cursor:pointer;line-height:1}
  .inline-form{background:#f4f6fd;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px}
  .ck{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 10px;font-size:14px;cursor:pointer;flex-wrap:wrap}

  .ck select{flex:0 0 auto;width:auto;min-width:130px;font-size:14px;padding:6px 8px}

  .wbox{display:grid;grid-template-columns:1fr 1fr;gap:8px}

  .wbox .wf .wl{font-size:12px;color:var(--sub)}

  .gate{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#eef1fb 0%,#e4eaff 55%,#efe7ff 100%)}

  .tb-name{font-size:12px;font-weight:700;color:var(--sub);margin-left:auto}
  .tbtn{font-size:12px;padding:5px 10px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--sub);cursor:pointer;font-weight:700}
  .tbtn.danger{color:var(--red);border-color:var(--red)}
</style>

<script>
const PREFIX='wb_tx_';

/* ================= 云端数据层（共享云数据库 · 多设备实时互通） ================= */
/* 三端共用同一份云库：校长/老师/学管读写相同 11 张表 → 数据天然互通 */
var STORE={},RID={},SYNC={online:false,txt:'连接中'},SESS=null,WQ=[],WBUSY=false,_BOUND=false;
var MKEYS=['teachers','students','courses','tasks','followups','income','refund','accounts','settings','fblib','xgTodos'];
/* STORE 键 → 云库 REST 表名（1:1） */
var TBL={teachers:'teachers',students:'students',courses:'courses',tasks:'tasks',followups:'followups',income:'income',refund:'refund',accounts:'accounts',settings:'settings',fblib:'fblib',xgTodos:'xgtodos'};
var ROLE='学管';

/* ---- 云请求封装（已验证契约：x-wb-webapp-access-key 头 + PostgREST） ---- */
const CLOUD_ENDPOINT='https://edu-workbench-15704.app.workbuddy.host';
const CLOUD_PKEY='wbpk_NGr1Mda2N9iWZdME2sRqkB_DoIqAcvLyDkJ5kZjub92gvsC53dlhIp4';
function _cloudReq(method,table,body,query){
  var url=CLOUD_ENDPOINT+'/.cloud/database/rest/'+table+(query?('?'+query):'');
  var h={'Content-Type':'application/json','x-wb-webapp-access-key':CLOUD_PKEY,'Prefer':'resolution=merge-duplicates,return=representation'};
  function once(){
    return fetch(url,{method:method,headers:h,body:body?JSON.stringify(body):undefined})
      .then(function(r){return r.json().then(function(j){return {ok:r.ok,status:r.status,data:j};});})
      .then(function(res){
        if(!res.ok||(res.data&&res.data.error))throw (res.data&&res.data.error)||new Error('http '+res.status);
        return res.data||[];
      });
  }
  function attempt(n){
    return once().catch(function(e){
      if(n<=0)throw e;
      var back=(e&&/429|network|fetch|Failed/.test(String(e.message||'')))?1000:500;
      return new Promise(function(r){setTimeout(r,back);}).then(function(){return attempt(n-1);});
    });
  }
  return attempt(3);
}
function _db(){return {from:function(t){return {
  select:function(){return _cloudReq('GET',t,null,'select=key,data');},
  upsert:function(rows){return _cloudReq('POST',t,rows);},
  del:function(key){return _cloudReq('DELETE',t,null,'key=eq.'+encodeURIComponent(key));}
};}};}

function _clone(o){try{return JSON.parse(JSON.stringify(o));}catch(e){return o;}}

/* ---- XSS 转义：STORE 中字符串恒为 HTML 转义后，渲染直接注入安全；云端存原文 ---- */
function _esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function _unesc(s){return String(s==null?'':s).replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");}
function _escDeep(o){if(typeof o==='string')return _esc(o);if(Object.prototype.toString.call(o)==='[object Array]')return o.map(_escDeep);if(o&&typeof o==='object'){var r={};Object.keys(o).forEach(function(k){r[k]=_escDeep(o[k]);});return r;}return o;}
function _unescDeep(o){if(typeof o==='string')return _unesc(o);if(Object.prototype.toString.call(o)==='[object Array]')return o.map(_unescDeep);if(o&&typeof o==='object'){var r={};Object.keys(o).forEach(function(k){r[k]=_unescDeep(o[k]);});return r;}return o;}
/* 写云/读云：用 base64 封装整段 JSON，使传输体只含 [A-Za-z0-9+/=]，
   彻底规避腾讯云 WAF 对原始尖括号/脚本片段的 403 拦截；STORE 仍为原始值（应用逻辑不变）。 */
function _b64enc(o){
  try{var bytes=new TextEncoder().encode(JSON.stringify(o));var bin='';for(var i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);return btoa(bin);}
  catch(e){var b=Buffer.from(JSON.stringify(o),'utf8');return b.toString('base64');}
}
function _b64dec(t){
  try{var bin=atob(t);var bytes=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return JSON.parse(new TextDecoder().decode(bytes));}
  catch(e){return JSON.parse(Buffer.from(t,'base64').toString('utf8'));}
}
function _ser(o){return _b64enc(o);}
function _deser(d){if(typeof d==='string')return _b64dec(d);return _clone(d);}

/* ---- 拉取 / 灌入 ---- */
function _pull(t){return _db().from(t).select();}
function _ingest(k,rows){
  if(k==='settings'){STORE.settings=rows.length?_deser(rows[0].data):null;return;}
  if(k==='fblib'){STORE.fblib=rows.length?_deser(rows[0].data):null;return;}
  if(k==='xgTodos'){STORE.xgTodos=rows.map(function(r){return _deser(r.data);});RID['xgTodos']={};rows.forEach(function(r){if(r.key)RID['xgTodos'][r.key]=1;});return;}
  STORE[k]=rows.map(function(r){return _deser(r.data);});
  RID[k]={};rows.forEach(function(r){if(r.key)RID[k][r.key]=1;});
}
function _hydrate(){
  var db=_db();if(!db)return Promise.reject(new Error('no-sdk'));
  return Promise.all(MKEYS.map(function(k){return _pull(TBL[k]).then(function(rows){_ingest(k,rows);});})).then(function(){_mirrorAll();});
}

/* ---- 写入队列（串行，避免并发超限） ---- */
function _flush(k,old){
  var t=TBL[k];
  if(k==='settings'||k==='fblib'){
    _enq(t,[{key:k,data:_ser(STORE[k]===undefined?null:STORE[k])}],[]);
    return;
  }
  var arr=load(k,[])||[], cur=RID[k]||{}, newRID={}, ups=[];
  arr.forEach(function(o){if(o&&o.id){newRID[o.id]=1;ups.push({key:o.id,data:_ser(o)});}});
  var dels=Object.keys(cur).filter(function(id){return !newRID[id];});
  RID[k]=newRID;
  _enq(t,ups,dels);
}
function _enq(t,ups,dels){
  if((!ups||!ups.length)&&(!dels||!dels.length))return;
  WQ.push({t:t,ups:ups||[],dels:dels||[]});
  _setStatus('待同步 '+WQ.length);
  if(!WBUSY)_drain();
}
function _drain(){
  if(WBUSY)return;
  var job=WQ[0];
  if(!job){_setStatus('已同步');return;}
  WBUSY=true;
  var db=_db(),seq=Promise.resolve();
  job.dels.forEach(function(key){seq=seq.then(function(){return db.from(job.t).del(key).catch(function(e){console.error('[drain] del fail',job.t,key,e&&e.message);});});});
  if(job.ups.length)seq=seq.then(function(){return db.from(job.t).upsert(job.ups).then(function(r){console.log('[drain] upsert ok',job.t,job.ups.length);return r;}).catch(function(e){console.error('[drain] upsert fail',job.t,JSON.stringify(job.ups).slice(0,200),e&&e.message);});});
  seq.then(function(){
    WQ.shift();WBUSY=false;
    _setStatus(WQ.length?('待同步 '+WQ.length):'已同步');
    if(WQ.length)_drain();
  });
}

/* ---- 跨设备轮询：他端/他设备改动 → 自动刷新（8s） ---- */
var _wtimer=null;
function _watch(){
  if(_wtimer)return;
  _wtimer=setInterval(function(){
    if(!SYNC.online)return;
    var g=document.getElementById('gate');if(g&&g.classList.contains('on'))return;
    var ae=document.activeElement;if(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))return;
    var before=JSON.stringify(dumpInner());
    _hydrate().then(function(){
      var after=JSON.stringify(dumpInner());
      if(before!==after){_setStatus('已同步');if(typeof refreshAll==='function')refreshAll();}
      if(typeof _revalidateSession==='function')_revalidateSession();
    }).catch(function(){});
  },8000);
}

/* ---- 离线自动重连：云端恢复后自动转在线 ---- */
var _rtimer=null;
function _tryReconnect(){
  if(_rtimer)return;
  var n=0;
  _rtimer=setInterval(function(){
    if(SYNC.online){clearInterval(_rtimer);_rtimer=null;return;}
    if(++n>12){clearInterval(_rtimer);_rtimer=null;return;}
    _hydrate().then(function(){
      SYNC.online=true;_setStatus('已同步');_watch();
      if(typeof refreshAll==='function')refreshAll();
      if(typeof _revalidateSession==='function')_revalidateSession();
    }).catch(function(){});
  },5000);
}
function dumpInner(){var o={};MKEYS.forEach(function(k){o[k]=STORE[k];});return o;}

/* 实时复检当前登录账号是否仍被启用/身份匹配：被停用则强制退出 */
function _revalidateSession(){

function _showGate(){

function _bindGate(){

  if(b)b.onclick=function(){

    for(var i=0;i<accs.length;i++){if((accs[i].name===name||accs[i].name===_esc(name))&&String(accs[i].code||'')===code){hit=accs[i];break;}}

    if(hit.role!==ROLE){if(err)err.textContent='该账号身份是「'+hit.role+'」，请打开对应端口登录';return;}
    _sessSet({id:hit.id,name:hit.name,role:hit.role,teacherId:hit.teacherId||''});
    if(err)err.textContent='';_enter();
  };
  var sl=document.getElementById('gSetupLink');
  if(sl)sl.onclick=function(e){e.preventDefault();var m=document.getElementById('gMain'),n=document.getElementById('gNew');if(m)m.style.display='none';if(n)n.style.display='block';};
  var bl=document.getElementById('gBackLink');
  if(bl)bl.onclick=function(e){e.preventDefault();_showGate();};
  var nb=document.getElementById('gNewBtn');
  if(nb)nb.onclick=function(){
    var name=(document.getElementById('nName').value||'').trim();
    var phone=(document.getElementById('nPhone').value||'').trim();
    var c1=(document.getElementById('nCode1').value||'').trim();
    var c2=(document.getElementById('nCode2').value||'').trim();
    var e2=document.getElementById('nErr');
    if(!name||!c1){if(e2)e2.textContent='请填写姓名和登录码';return;}
    if(c1!==c2){if(e2)e2.textContent='两次输入的登录码不一致';return;}
    if(load('accounts',[]).length){if(e2)e2.textContent='已存在账号，请直接登录';return;}
    var acc={id:uid(),name:name,phone:phone,role:'校长',code:c1,teacherId:'',active:true,note:'首次创建'};
    var arr=load('accounts',[]);arr.push(acc);save('accounts',arr);
    _sessSet({id:acc.id,name:acc.name,role:acc.role,teacherId:''});
    if(e2)e2.textContent='';_enter();
  };
  var lo=document.getElementById('btnLogout');
  if(lo)lo.onclick=function(){_sessSet(null);location.reload();};
  var ex=document.getElementById('btnExport');
  if(ex)ex.onclick=function(){
    try{
      var blob=new Blob([JSON.stringify({v:1,exportAt:_today(),data:STORE},null,1)],{type:'application/json'});
      var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='教培工作台备份-'+_today()+'.json';
      document.body.appendChild(a);a.click();document.body.removeChild(a);
    }catch(e){alert('当前环境不支持下载，请改用右上角菜单');}
  };
  var im=document.getElementById('importFile');
  if(im)im.onchange=function(){
    var f=im.files&&im.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var j=JSON.parse(r.result),d=j.data||j;
        MKEYS.forEach(function(k){if(d[k]!==undefined){STORE[k]=d[k];_mirror(k);if(SYNC.online)_flush(k,null);}});
        alert('备份已导入');if(typeof refreshAll==='function')refreshAll();
      }catch(e){alert('备份文件解析失败');}
    };
    r.readAsText(f);im.value='';
  };
}
function start(){
  _primeLocal();
  var db=_db();
  if(!db){SYNC.online=false;_setStatus('本机模式·登录后可同步');_bindGate();
    var s0=_sessGet();
    if(_validSession(s0)){SESS=s0;_enter();}else{_sessSet(null);_showGate();}
    return;
  }
  _setStatus('连接中');
  _hydrate().then(function(){
    SYNC.online=true;_setStatus('已同步');_bindGate();_watch();
    var s=_sessGet();
    if(_validSession(s)){SESS=s;_enter();}else{_sessSet(null);_showGate();}
  }).catch(function(){
    /* 云端暂不可达：本地已缓存账号与登录态，仍保持登录（离线可用），并后台自动重连 */
    SYNC.online=false;_setStatus('离线模式');_bindGate();
    var s=_sessGet();
    if(_validSession(s)){SESS=s;_enter();}else{_showGate();}
    _tryReconnect();
  });
}

function deductForCourse(c){
  const stus=getStudents();let changed=false;
  (c.students||[]).forEach(st=>{const i=stus.findIndex(x=>x.id===st.studentId);if(i<0)return;const consume=st.consume||'正课';
    if(consume==='正课'){stus[i].regular.left=(stus[i].regular.left||0)-c.duration;}
    else if(consume==='elective'){stus[i].welfare=stus[i].welfare||emptyWelfare();stus[i].welfare.elective.count=Math.max(0,(stus[i].welfare.elective.count||0)-c.duration);}
    else if(consume==='mock'){stus[i].welfare=stus[i].welfare||emptyWelfare();stus[i].welfare.mock.count=Math.max(0,(stus[i].welfare.mock.count||0)-c.duration);}
    changed=true;});
  if(changed)save('students',stus);
}

  else list.innerHTML=cs.map(c=>`<div class="item" data-c="${c.id}"><div class="main"><div class="t">${c.date} ${c.time} · ${courseNames(c)}（${c.subject}）</div><div class="s">${c.teacherName} · ${c.classType==='1v1'?'一对一':'班课'} · ${c.duration}课时 · ${c.type==='福利课'?'福利课':'正课'} · ${c.status}</div></div><span class="tag">编辑</span></div>`).join('');
  list.querySelectorAll('[data-c]').forEach(el=>el.onclick=()=>openCourse(el.dataset.c));
}

function renderStu(){
  const list=document.getElementById('stuList');
  const stus=getStudents();
  if(!stus.length)list.innerHTML='<div class="empty">暂无学员</div>';
  else list.innerHTML=stus.map(s=>`<div class="item" data-stu="${s.id}"><div class="main"><div class="t">${s.name} <span class="muted">${dispGrade(s)}·${s.regular.type==='1v1'?'一对一':'班课'}</span></div><div class="s">剩余正课 ${fmtH(s.regular.left)} · 福利 ${welfareText(s.welfare)} · ${s.status}</div></div><span class="tag">${s.status}</span></div>`).join('');
  list.querySelectorAll('[data-stu]').forEach(el=>el.onclick=()=>openStu(el.dataset.stu));
}

function followSummary(f){
  const parts=[];
  if(f.content)parts.push('📚 内容：'+f.content);
  if(f.require)parts.push('📌 要求：'+f.require);
  if(f.problem)parts.push('⚠️ 问题：'+f.problem);
  if(f.measure)parts.push('🛠 措施：'+f.measure);
  const body=parts.length?parts.join('\n'):(f.text||'');
  return '家长好！今日【'+(f.subject||'')+'】反馈 ✅\n'+body;
}
function renderFollow(){
  const list=document.getElementById('followList');
  const fs=getFollowups().slice().sort((a,b)=>b.date.localeCompare(a.date));
  if(!fs.length)list.innerHTML='<div class="empty">暂无跟进记录</div>';
  else list.innerHTML=fs.map(f=>`<div class="item" style="flex-direction:column;align-items:flex-start"><div class="main" style="width:100%"><div class="t">${f.studentName} · ${f.teacherName||'学管'} · ${f.date}</div><div class="s" style="margin-top:6px;white-space:pre-wrap;line-height:1.6">${followSummary(f)}</div></div></div>`).join('');
}

function renderWarn(){
  const list=document.getElementById('warnList');
  const ws=getStudents().filter(s=>s.regular.left<=4&&s.status==='在读');
  if(!ws.length)list.innerHTML='<div class="empty">暂无预警，学员课时充足 👍</div>';
  else list.innerHTML=ws.map(s=>`<div class="item"><div class="main"><div class="t">${s.name} <span class="muted">${dispGrade(s)}·${s.regular.type==='1v1'?'一对一':'班课'}</span></div><div class="s">剩余正课 ${fmtH(s.regular.left)}，请及时联系续费</div></div><span class="tag red">预警</span></div>`).join('');
}

function renderFb(){
  const sel=document.getElementById('fbStu');
  const stus=getStudents();
  sel.innerHTML='<option value="">-- 请选择学员 --</option>'+stus.map(s=>`<option value="${s.id}">${s.name}（${dispGrade(s)}）</option>`).join('');

function fbGroups(){const g={content:[],status:[],require:[],problem:[],encourage:[],measure:[]};Object.keys(state.fbSel).forEach(k=>{if(state.fbSel[k]){const idx=k.indexOf('|');g[k.slice(0,idx)].push(k.slice(idx+1));}});return g;}
function genFeedback(s,g){
  const name=s.name;const subj=studentSubject(s)||'本课';const L=[];
  L.push('家长您好！今天【'+subj+'】的课堂情况跟您同步一下～');
  if(g.content.length)L.push('今天'+name+'主要学习了：'+g.content.join('、')+'。');
  const hasProb=g.problem.length>0,hasEnc=g.encourage.length>0,hasStatus=g.status.length>0;
  let mood = hasProb&&!hasEnc?'attn':(hasProb&&hasEnc?'mix':'good');
  let para='';
  if(hasStatus)para+='课堂上'+g.status.join('，')+'；';
  if(mood==='good'){para+=(hasEnc?g.encourage.join('，')+'，整体状态很棒。':'整体表现稳定在线。');}
  else if(mood==='mix'){para+='有亮点也有要打磨的地方——'+g.encourage.join('，')+'，不过'+g.problem.join('，')+'，这一块我们多花点心思。';}
  else{para+='有个小地方需要留意：'+g.problem.join('，')+'，相信慢慢能调整过来。';}
  if(para)L.push(para);
  if(g.require.length)L.push('课后麻烦提醒孩子：'+g.require.join('；')+'。');
  if(g.measure.length)L.push('接下来我会'+g.measure.join('；')+'，家校一起帮孩子巩固。');
  const closings={good:['为'+name+'的进步点赞，继续加油！🌟','今天状态在线，期待下节课更精彩～💪'],mix:['一步一个脚印，'+name+'会越来越稳的，我们一起加油！🌱'],attn:['调整后相信会有改善，辛苦家长一起配合，谢谢！🤝']};
  L.push(closings[mood][0]);
  return L.join('\n');
}
function renderFbOut(){
  const out=document.getElementById('fbOut');
  if(!state.fbStu){out.style.color='var(--sub)';out.textContent='选择学员并点选关键词，自动生成反馈文案…';return;}
  const s=getStudents().find(x=>x.id===state.fbStu);
  out.style.color='var(--ink)';
  out.textContent=genFeedback(s,fbGroups());
}

/* 弹窗 */
function openStu(id){
  const s=id?getStudents().find(x=>x.id===id):null;state.editStu=id;
  document.getElementById('sName').value=s?s.name:'';
  const gsel=document.getElementById('sGrade');gsel.innerHTML=GRADES.map(g=>`<option ${s&&g===s.grade?'selected':''}>${g}</option>`).join('');
  document.getElementById('sPhone').value=s?s.phone:'';
  document.getElementById('sStatus').value=s?s.status:'线索';
  document.getElementById('sNote').value=s?s.note||'':'';
  document.getElementById('mStu').classList.add('on');
}
function openCourse(id){
  state.editCourse=id||null;
  const c=id?getCourses().find(x=>x.id===id):{};
  // 关键修复：打开弹窗时直接填充老师下拉
  const cTe=document.getElementById('cTe');
  cTe.innerHTML=getTeachers().map(t=>`<option value="${t.id}">${teacherLabel(t)}</option>`).join('');
  document.getElementById('cDate').value=c.date||dstr(TODAY);
  document.getElementById('cTime').value=c.time||'09:00';
  document.getElementById('cType').value=c.classType||'班课';
  if(c.teacherId&&[...cTe.options].some(o=>o.value===c.teacherId))cTe.value=c.teacherId;
  document.getElementById('cHrs').value=c.duration||1;
  document.getElementById('cNote').value=c.note||'';
  renderCourseStuBox();
  const box=document.getElementById('cStuBox');
  if(c.students){box.querySelectorAll('input[data-sid]').forEach(cb=>{const st=c.students.find(x=>x.studentId===cb.dataset.sid);if(st){cb.checked=true;const sel=box.querySelector('select[data-csid="'+cb.dataset.sid+'"]');if(sel&&(st.consume==='正课'||st.consume==='elective'||st.consume==='mock'))sel.value=st.consume;}});}
  document.getElementById('cDel').style.display=id?'block':'none';
  document.getElementById('mCourse').classList.add('on');
}
function renderCourseStuBox(){
  const box=document.getElementById('cStuBox');
  const type=document.getElementById('cType').value;
  const stus=getStudents();
  box.innerHTML=stus.map(s=>{
    const w=s.welfare||emptyWelfare();
    const opts=[];
    if((s.regular.type===type)&&(s.regular.left||0)>0)opts.push('<option value="正课">正课('+fmtH(s.regular.left)+'次)</option>');
    if((w.elective.type===type)&&(w.elective.count||0)>0)opts.push('<option value="elective">任选课('+w.elective.count+'次)</option>');
    if((w.mock.type===type)&&(w.mock.count||0)>0)opts.push('<option value="mock">押题课('+w.mock.count+'次)</option>');
    if(!opts.length)opts.push('<option value="正课">无可用额度</option>');
    const mat=[];if(w.paper)mat.push('试卷分析'+w.paper+'次');if(w.materials&&w.materials.count)mat.push('定制资料'+w.materials.count+'科'+(w.materials.desc?('·'+w.materials.desc):''));
    return `<label class="ck"><input type="checkbox" data-sid="${s.id}" data-sname="${s.name}"> ${s.name}（${dispGrade(s)}·${s.regular.type==='1v1'?'一对一':'班课'}·余${fmtH(s.regular.left)}）`
      +`<select data-csid="${s.id}">${opts.join('')}</select>`
      +(mat.length?`<span class="mini">已发资料：${mat.join('、')}</span>`:'')
      +`</label>`;
  }).join('');
}

function refreshAll(){
  renderBanner();
  if(state.tab==='today'){fillSelects();renderToday();}
  else if(state.tab==='sched'){fillSelects();renderSched();}
  else if(state.tab==='stu'){renderStu();}
  else if(state.tab==='follow'){renderFollow();}
  else if(state.tab==='warn'){renderWarn();}
  else if(state.tab==='fb'){fillSelects();renderFb();renderFbOut();}
}
function fillSelects(){
  const cTe=document.getElementById('cTe');if(cTe)cTe.innerHTML=getTeachers().map(t=>`<option value="${t.id}">${teacherLabel(t)}</option>`).join('');
  const ptTe=document.getElementById('ptTe');if(ptTe)ptTe.innerHTML=getTeachers().map(t=>`<option value="${t.id}">${teacherLabel(t)}</option>`).join('');
  const cTime=document.getElementById('cTime');if(cTime&&!cTime.value)cTime.value='09:00';
  const ptDue=document.getElementById('ptDue');if(ptDue&&!ptDue.value)ptDue.value=dstr(TODAY);

}
function switchTab(t){
  state.tab=t;
  document.querySelectorAll('#nav .tab').forEach(x=>x.classList.toggle('on',x.dataset.t===t));
  ['today','sched','stu','follow','warn','fb'].forEach(n=>document.getElementById('tab-'+n).classList.toggle('hide',n!==t));
  refreshAll();
}

function bind(){
  document.querySelectorAll('#nav .tab').forEach(t=>t.onclick=()=>switchTab(t.dataset.t));
  document.querySelectorAll('[data-close]').forEach(x=>x.onclick=()=>x.closest('.modal').classList.remove('on'));
  document.getElementById('todoAdd').onclick=()=>{const v=document.getElementById('todoIn').value.trim();if(!v){alert('请输入待办');return;}const ts=getTodos();ts.push({id:uid(),text:v,done:false});save('xgTodos',ts);document.getElementById('todoIn').value='';refreshAll();};
  document.getElementById('ptAdd').onclick=()=>{
    const tid=document.getElementById('ptTe').value;const title=document.getElementById('ptTitle').value.trim();const due=document.getElementById('ptDue').value;
    if(!tid||!title){alert('请选择老师并填写待办内容');return;}
    const t=getTeachers().find(x=>x.id===tid);
    const tasks=getTasks();tasks.push({id:uid(),title,due,toAll:false,teacherIds:[tid],teacherNames:[teacherLabel(t)],done:false,createdAt:dstr(TODAY),publisher:'学管'});
    save('tasks',tasks);document.getElementById('ptTitle').value='';refreshAll();alert('已下发给 '+teacherLabel(t));
  };
  document.getElementById('addStu').onclick=()=>openStu(null);
  document.getElementById('sSave').onclick=()=>{
    const stus=getStudents();const name=document.getElementById('sName').value.trim();
    if(!name){alert('请填写姓名');return;}
    const o={id:state.editStu||uid(),name,grade:document.getElementById('sGrade').value,phone:document.getElementById('sPhone').value,regular:{type:'班课',total:0,left:0},welfare:emptyWelfare(),status:document.getElementById('sStatus').value,note:document.getElementById('sNote').value,enrollYear:schoolYearOf(TODAY),source:''};
    if(state.editStu){const i=stus.findIndex(s=>s.id===state.editStu);stus[i]=o;}else stus.push(o);save('students',stus);document.getElementById('mStu').classList.remove('on');refreshAll();
  };
  document.getElementById('sDel').onclick=()=>{if(!state.editStu)return;if(!confirm('确认删除该学员？'))return;save('students',getStudents().filter(s=>s.id!==state.editStu));document.getElementById('mStu').classList.remove('on');refreshAll();};
  document.getElementById('cType').onchange=()=>renderCourseStuBox();
  document.getElementById('addCourse').onclick=()=>openCourse(null);
  document.getElementById('cSave').onclick=()=>{
    const tid=document.getElementById('cTe').value;
    if(!tid){alert('请选择老师');return;}
    const type=document.getElementById('cType').value;
    const box=document.getElementById('cStuBox');
    const checks=[...box.querySelectorAll('input[data-sid]:checked')];
    if(!checks.length){alert('请至少勾选一名学员');return;}
    if(type==='1v1'&&checks.length>1){alert('一对一只能选 1 名学生');return;}
    const students=checks.map(cb=>{const sel=box.querySelector('select[data-csid="'+cb.dataset.sid+'"]');return {studentId:cb.dataset.sid,studentName:cb.dataset.sname,consume:sel?sel.value:'正课'};});
    const anyWelfare=students.some(st=>st.consume!=='正课');
    const t=getTeachers().find(x=>x.id===tid);
    const cs=getCourses();
    const rec={date:document.getElementById('cDate').value,time:document.getElementById('cTime').value,teacherId:tid,teacherName:teacherLabel(t),classType:type,subject:t.subject,duration:+document.getElementById('cHrs').value||1,status:'未上',note:document.getElementById('cNote').value,type:anyWelfare?'福利课':'正课',students};
    if(state.editCourse){const i=cs.findIndex(c=>c.id===state.editCourse);cs[i]={...cs[i],...rec};}else cs.push({id:uid(),...rec});
    save('courses',cs);document.getElementById('mCourse').classList.remove('on');refreshAll();alert('排课已保存（班课已合并为一条）');
  };
  document.getElementById('cDel').onclick=()=>{if(!state.editCourse)return;if(!confirm('确认删除该排课？'))return;save('courses',getCourses().filter(c=>c.id!==state.editCourse));document.getElementById('mCourse').classList.remove('on');refreshAll();};
  document.getElementById('fbDate').onchange=()=>{state.fbDate=document.getElementById('fbDate').value;refreshAll();};
  document.getElementById('fbTime').oninput=()=>{state.fbTime=document.getElementById('fbTime').value;refreshAll();};
  document.getElementById('fbClear').onclick=()=>{state.fbSel={};refreshAll();};
  document.getElementById('fbCopy').onclick=()=>{if(!state.fbStu){alert('请先选择学员');return;}const txt=document.getElementById('fbOut').textContent;navigator.clipboard?navigator.clipboard.writeText(txt).then(()=>alert('已复制反馈文案')):alert(txt);};
  document.getElementById('fbSave').onclick=()=>{
    if(!state.fbStu){alert('请先选择学员');return;}
    const s=getStudents().find(x=>x.id===state.fbStu);const g=fbGroups();
    const fs=getFollowups();
    fs.push({id:uid(),studentId:s.id,studentName:s.name,teacherId:'',teacherName:'学管',courseId:'',date:state.fbDate||dstr(TODAY),subject:studentSubject(s),content:g.content.join('；'),status:g.status.join('；'),require:g.require.join('、'),problem:g.problem.join('、'),encourage:g.encourage.join('、'),measure:g.measure.join('、'),text:document.getElementById('fbOut').textContent});
    save('followups',fs);alert('已保存为跟进记录');
  };
}

<script>
/* PWA：注册 Service Worker（注册 URL 动态携带 sharecode），使 Chrome 可「安装应用」到桌面 */
(function(){
  try{
    if(!('serviceWorker' in navigator)||location.protocol!=='https:')return;
    var sc=new URLSearchParams(location.search).get('sharecode');
    if(!sc)return;
    var m=document.querySelector('link[rel="manifest"]');
    if(m&&m.getAttribute('href').indexOf('sharecode='+sc)<0){
      m.setAttribute('href',m.getAttribute('href').split('?')[0]+'?sharecode='+encodeURIComponent(sc));
    }
    navigator.serviceWorker.register('sw.js?sharecode='+encodeURIComponent(sc),{scope:'./'}).catch(function(){});
  }catch(e){}
})();
</script>
<script>
/* ===== 手机端弹窗自适应：跟随可视视口（软键盘 / 浏览器工具栏 / 地址栏） ===== */
(function(){
  function vp(){var v=window.visualViewport;return {h:(v&&v.height)?v.height:(window.innerHeight||document.documentElement.clientHeight||0),t:(v&&v.offsetTop)?v.offsetTop:0};}
  function fit(){
    var ms=document.querySelectorAll('.modal.on');
    if(!ms.length)return;
    var p=vp(),h=p.h;if(!h||h<160)return;
    for(var i=0;i<ms.length;i++){
      var m=ms[i];
      m.style.top=p.t+'px';m.style.bottom='auto';m.style.height=h+'px';
      var s=m.querySelector('.sheet');
      if(s)s.style.maxHeight=Math.max(200,Math.round(h*0.92))+'px';
    }
  }
  function bind(){
    var ms=document.querySelectorAll('.modal');
    for(var i=0;i<ms.length;i++){(function(m){
      if(m.__mf)return;m.__mf=1;
      try{new MutationObserver(function(){if(m.classList.contains('on'))fit();}).observe(m,{attributes:true,attributeFilter:['class']});}catch(e){}
    })(ms[i]);}
  }
  function boot(){bind();fit();}
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',boot);}else{boot();}
  window.addEventListener('resize',fit,{passive:true});
  window.addEventListener('orientationchange',function(){setTimeout(fit,150);});
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',fit,{passive:true});
    window.visualViewport.addEventListener('scroll',fit,{passive:true});
  }
  document.addEventListener('focusin',function(e){if(e.target&&e.target.closest&&e.target.closest('.modal')){setTimeout(fit,120);setTimeout(fit,340);}},true);
  document.addEventListener('focusout',function(e){if(e.target&&e.target.closest&&e.target.closest('.modal')){setTimeout(fit,120);setTimeout(fit,340);}},true);
  /* 点弹窗外的暗色区域即可关闭，避免小屏下只能靠右上角 × */
  document.addEventListener('click',function(e){if(e.target&&e.target.classList&&e.target.classList.contains('modal'))e.target.classList.remove('on');},true);
  window._fitModal=fit;
})();
</script>
